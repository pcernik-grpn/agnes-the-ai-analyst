[pytest]
addopts = -m "not live and not docker" --timeout=60 --strict-markers
# A full-suite run writes tens of GB of DuckDB/parquet/pgserver fixtures into
# pytest's basetemp; the default keeps the last 3 sessions in full, which
# accumulated 56+ GB and filled the disk.
#
# `1` keeps the PREVIOUS session alongside the current one — the startup sweep
# deletes anything older. DO NOT set this to `0`. Tried and reverted: with `0`
# the startup sweep deletes the CURRENT session's numbered dir too, so live
# tests lose their tmp_path mid-run — `FileNotFoundError` on paths the fixture
# just created, ~4900 errors across the suite. The retention floor is 1.
#
# Residual headroom is still guarded: `pytest_sessionstart` in
# tests/conftest.py refuses to start a run that cannot fit, naming the cleanup
# command, rather than letting the suite wedge the machine.
#
# A fully GREEN run additionally deletes its own basetemp at session end
# (`pytest_sessionfinish` in tests/conftest.py; AGNES_KEEP_BASETEMP=1 keeps
# it), so the retention below effectively covers failed/interrupted runs.
# Per-test DuckDB files are also created with 16 KiB blocks in tests (the
# duckdb.connect wrapper at the top of tests/conftest.py) — both together
# took a full local run from 51 GB retained to ~28 GB in-flight and ~0
# retained after a green run.
tmp_path_retention_count = 1
# `failed` deletes each PASSING test's tmp_path in its teardown finalizer,
# collapsing peak scratch from sum-of-all-tests (~38-40 GB per full run) to
# failures + in-flight tests + session-scoped fixture dirs.
#
# INVARIANT that makes this safe: no live handle may outlive its tmp dir.
# The app caches open handles process-globally, keyed by PATH — DuckDB
# connections (get_system_db() & siblings in src/db.py), DuckLake sessions,
# and root-logger FileHandlers — and pytest REUSES a deleted numbered dir
# name for the next same-named test, so a handle surviving the deletion
# string-matches the new test's path and keeps serving the unlinked file
# (historically: `Duplicate key "id: admin1"` in seeded_app, ~57 spurious
# errors, which forced this back to `all` for a while; and a leaked
# collector log handler turning later `logger.info()` calls into
# FileNotFoundError). The autouse fixture `_close_tmp_handles` in
# tests/conftest.py upholds the invariant by releasing any such handle
# pointing into basetemp at each test's teardown. Keep that fixture and this
# policy in sync: flipping this back to `all` without reading its docstring
# wastes the disk win; deleting the fixture while this says `failed`
# resurrects those errors.
tmp_path_retention_policy = failed
markers =
    live: tests requiring server access (run with '-m live')
    docker: tests requiring Docker (run with '-m docker')
    integration: FastAPI TestClient API integration tests
    journey: end-to-end user flow tests spanning multiple components
    slow: slow tests that spawn real subprocesses or bind network sockets
    no_routing_override: opt out of test_self_upgrade.py's autouse fixture that defaults `_python_is_uv_tool_install` to True
