# Bind-mount overlay — replaces the `data` named volume with a direct
# host bind mount per service.
#
# Why direct service-level bind, not driver_opts on the named volume
# ------------------------------------------------------------------
# The previous version of this file modified the `data` named volume's
# `driver_opts` to point at /data with `o: bind,rbind`. Docker named
# volumes have an immutability footgun: once a volume is created, its
# driver options are fixed for the life of the volume. Editing this
# file and re-running `docker compose up -d` does NOT propagate the
# new options to existing volumes — they keep whatever options were
# in effect at create time.
#
# This bit a deployer in production: the volume
# was created before this overlay had `bind,rbind`, kept the old
# `bind` (non-recursive) propagation, and containers wrote to a
# shadowed subdirectory of the parent disk instead of the nested
# child mount. DuckDB went FATAL on a root-owned WAL during a
# routine container recreate; sign-in broke.
#
# Direct service-level bind mounts (`/host/path:/container/path`)
# don't go through Docker's volume layer at all. They re-evaluate
# the mount options every container start, and modern Docker Engine
# (20.10+) defaults to recursive bind for these. No options to
# forget, no immutable state to migrate, no shadow-mount class.
#
# What this overlay does
# ----------------------
# `volumes: !override` on each service replaces the base
# `data:/data` named-volume mount with a direct `/data:/data` host
# bind. The named volume `data:` declared at the bottom of
# docker-compose.yml is left intact (still useful for local-dev
# `compose up` without this overlay) but is no longer referenced
# by any service when the overlay is active.
#
# When the operator's host has a nested mount under /data (e.g. a
# separate state disk mounted at /data/state), the recursive bind
# carries that nested mount into every container automatically.
#
# Usage (combined with docker-compose.prod.yml):
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.prod.yml \
#     -f docker-compose.host-mount.yml \
#     up -d
#
# Do NOT use this overlay in CI — /data does not exist on GitHub
# runners.
#
# Compose-spec version requirement: !override merge tag is part of
# the Compose Specification supported by Docker Compose v2.20+ and
# the compose-go library used by Compose v5+. If you need to support
# older clients, fork this overlay into per-service files.

services:
  app:
    volumes: !override
      - /data:/data
      - ./config:/app/config:ro

  extract:
    volumes: !override
      - /data:/data
      - ./config:/app/config:ro

  scheduler:
    volumes: !override
      - /data:/data
      - ./config:/app/config:ro

  extraction-worker:
    volumes: !override
      - /data:/data
      - ./config:/app/config:ro

  # NOTE: data-migrate override moved to docker-compose.postgres-host-mount.yml
  # because referencing data-migrate here breaks validation when this file is
  # loaded without docker-compose.postgres.yml (data-migrate is defined only
  # there; reference here makes compose error "service has neither image nor
  # build context" on the default baseline chain).

  telegram-bot:
    volumes: !override
      - /data:/data

  # apps-runner's override lives BELOW caddy — one service, one key. A second
  # `apps-runner:` block here made this file invalid YAML (duplicate mapping
  # key), which every `docker compose` call on a deployed VM rejects outright.

  caddy:
    # Caddy was originally inheriting `data:/srv:ro` from the base
    # service. Once the other services switch to direct binds and
    # nothing populates the `data:` named volume, that inherited
    # mount points at an empty Docker-managed volume — and the
    # @download `try_files /bigquery/data/<id>.parquet …` block
    # in Caddyfile finds nothing, so every parquet download falls
    # through to the app's uvicorn worker, defeating the v0.36.0
    # file_server bypass.
    #
    # Restate every mount the base caddy service depends on; mirror
    # the same caveat that lives in flat-mount.yml.
    volumes: !override
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./static:/caddy-static:ro
      - /data/state/certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
      - /data:/srv:ro

  # apps-runner (compose profile `apps`) needs the same treatment, and for the
  # same reason spelled out for caddy above: left on the base `data:` named
  # volume while every other service binds the host `/data`, it ends up on a
  # filesystem nothing else can see.
  #
  # This does NOT break the data-app containers it starts — `_resolve_host_path`
  # (services/apps_runner/api.py) reads this container's own Mounts and hands
  # the daemon whatever Source it finds, which works for a named volume and a
  # bind alike. What it breaks is everything that assumes the app and the
  # sidecar share `${DATA_DIR}/apps/<slug>`: `_rmtree_config_dir`
  # (app/api/data_apps.py) deletes that directory on app/draft delete because
  # its `config.json` holds the service JWT in plaintext — and from the app's
  # host-bound `/data` the sidecar's copy simply isn't there, so the delete
  # hits FileNotFoundError, swallows it by design, and the credential file
  # stays behind on every Terraform-deployed VM.
  #
  # UPGRADE NOTE for an instance that already ran `--profile apps` under this
  # overlay: this moves the sidecar's `${DATA_DIR}` from the Docker-managed
  # `data:` volume to the host `/data`, so each already-deployed app's
  # `apps/<slug>/config.json` — the file whose plaintext service JWT motivates
  # this change — stays behind in the OLD volume, now referenced by nothing
  # and out of `_rmtree_config_dir`'s reach for good. Running containers are
  # unaffected (they keep the bind they were created with); the next deploy
  # of each app writes its config under the host path and from then on delete
  # cleans up correctly. To clear the stranded copies, after recreating the
  # stack:
  #
  #   docker run --rm -v <project>_data:/old alpine sh -c 'rm -rf /old/apps'
  #
  # Revoke-on-delete already happened server-side, so a JWT left in an
  # orphaned file is dead for any app that was deleted; the live ones are
  # simply duplicated until their next deploy.
  #
  # The docker socket mount must be restated: `!override` replaces the whole
  # list, and without the socket the sidecar has no daemon at all.
  apps-runner:
    volumes: !override
      - /data:/data
      - /var/run/docker.sock:/var/run/docker.sock
