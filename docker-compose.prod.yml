# Production override — uses pre-built GHCR image instead of local build.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Override tag: AGNES_TAG=stable-2026.04.3 docker compose -f ... up -d
#
# For persistent-disk-backed /data on GCE, compose this overlay with
# docker-compose.host-mount.yml — which binds the `data` named volume to /data.
services:
  app:
    image: ${AGNES_IMAGE_REPO:-ghcr.io/keboola/agnes-the-ai-analyst}:${AGNES_TAG:-stable}
  scheduler:
    image: ${AGNES_IMAGE_REPO:-ghcr.io/keboola/agnes-the-ai-analyst}:${AGNES_TAG:-stable}
  extract:
    image: ${AGNES_IMAGE_REPO:-ghcr.io/keboola/agnes-the-ai-analyst}:${AGNES_TAG:-stable}
  telegram-bot:
    image: ${AGNES_IMAGE_REPO:-ghcr.io/keboola/agnes-the-ai-analyst}:${AGNES_TAG:-stable}
  # apps-runner (compose profile `apps`) is a `build: .` service like the four
  # above and MUST get the same image override: production/Terraform VMs extract
  # only the compose files + host scripts into /opt/agnes (no Dockerfile / source
  # on disk), so without this `docker compose --profile apps up` would try to
  # build it, find no Dockerfile, and abort the whole stack's boot.
  apps-runner:
    image: ${AGNES_IMAGE_REPO:-ghcr.io/keboola/agnes-the-ai-analyst}:${AGNES_TAG:-stable}
  # egress-proxy (compose profile `chat-docker-egress`) — same source-less
  # prod-VM reasoning as apps-runner above.
  egress-proxy:
    image: ${AGNES_IMAGE_REPO:-ghcr.io/keboola/agnes-the-ai-analyst}:${AGNES_TAG:-stable}
  # kai-agent-stub (compose profile `kai-stub`) is the DEVELOPMENT stub engine
  # and has no business running on a prod VM — but it carries `build: .`, and
  # the override is what keeps a source-less host from trying to build it if
  # the profile were ever selected there. Pinning the image is a boot-safety
  # measure, NOT an endorsement: the stub answers every turn with a canned
  # script, so selecting `--profile kai-stub` in production would replace real
  # answers with fixtures. The real engine is the `kai-agent` service a
  # deployment brings its own overlay for.
  kai-agent-stub:
    image: ${AGNES_IMAGE_REPO:-ghcr.io/keboola/agnes-the-ai-analyst}:${AGNES_TAG:-stable}
  # extraction-worker (compose profile `extraction-worker`) is `build:`
  # like the services above and needs the same source-less-prod-VM override
  # for the same reason. It runs the SAME image as `app`/`scheduler` here —
  # this override does NOT publish a separate producer-bundled variant; a
  # deployment that built its own `worker`-target image with
  # EXTRACTION_PRODUCER_INSTALL (see the Dockerfile) points this at that
  # image instead (mirrors the `-rich` tag pattern .github/workflows/
  # image-rich.yml uses for docling/embeddings).
  extraction-worker:
    image: ${AGNES_IMAGE_REPO:-ghcr.io/keboola/agnes-the-ai-analyst}:${AGNES_TAG:-stable}
  # corporate-memory and session-collector were dropped in #176 —
  # the scheduler container drives them via /api/admin/run-* endpoints.
