# Google Cloud Ops Agent — receives Agnes' container logs over the Docker
# fluentd driver (docker-compose.gcp-logging.yml) and writes them to Cloud
# Logging as structured entries.
#
# Installed and placed at /etc/google-cloud-ops-agent/config.yaml by
# startup-script.sh.tpl when enable_gcp_logging is true. The agent
# authenticates as the VM service account, which the module grants
# roles/logging.logWriter.
#
# The two processors are the whole point of using the agent instead of
# Docker's gcplogs driver: parse_json turns the app's log line back into
# fields, and modify_fields lifts its `severity` onto the entry so the Logs
# Explorer's level filter works. Without them every entry is DEFAULT
# severity with the payload as one string.
logging:
  receivers:
    agnes_containers:
      type: fluent_forward
      port: 24224
  processors:
    # Docker's fluentd driver puts the container's line in `log`; Agnes
    # writes one JSON object per line (app/logging_config.py).
    agnes_json:
      type: parse_json
      field: log
      time_key: time
      time_format: "%Y-%m-%dT%H:%M:%S.%L%z"
    agnes_severity:
      type: modify_fields
      fields:
        severity:
          move_from: jsonPayload.severity
          # A line the app did not write as JSON (a library writing plain
          # text, a crash dump) has no severity to lift — default it rather
          # than dropping the entry.
          default_value: INFO
  service:
    pipelines:
      agnes:
        receivers: [agnes_containers]
        processors: [agnes_json, agnes_severity]
