name: CI

on:
  push:
    # `integration` is the shared staging branch every contributor merges
    # into before anything reaches `main`. It needs the same push-side gate
    # as `main`: the merge commit itself must be tested, not just each PR
    # in isolation.
    # `ci/update-test-durations-*` used to be listed here, to "run CI on push
    # to ci/update-test-durations-* branches so auto-created PRs get checks"
    # (56d39524b). It never did that: on every such PR traced (#1350, #1812,
    # #1906) the bot's own push produced a `pull_request` run and NO `push`
    # run — a push made with the default `GITHUB_TOKEN` does not create a
    # workflow run, which is the very reason the workaround was reached for.
    # The `pull_request` event was always what covered the bot's commit.
    #
    # What the entry DID do is duplicate: a HUMAN push to such a branch (the
    # `main` merge needed to clear `strict` branch protection) matched both
    # this filter and `pull_request`, so one commit ran the 12-job matrix
    # twice — visible as two `test` check-runs on the same head on all three
    # of those PRs. Removing it halves CI for the weekly durations PR and
    # loses no coverage.
    branches: [main, integration, "feature/**"]
  pull_request:
    # PRs targeting `integration` must run the full suite too — without
    # this filter GitHub fires no workflow at all for them and the PR shows
    # a green rollup that asserted nothing.
    branches: [main, integration]
  # Inert until a merge queue is enabled on `main` (a ruleset rule). Once it
  # is, the queue builds the merged result once and needs this event to run
  # the required checks on it — the automated form of the hand-driven merge
  # train, and what makes `main`'s `strict` up-to-date rule redundant (#2295).
  merge_group:
  schedule:
    - cron: "0 3 * * *"  # Nightly at 03:00 UTC — runs docker-e2e
  workflow_dispatch:

# One CI run per pull request at a time. Without this, a measured 16-hour
# window held 100 runs across 47 branches of which 25 were STILL RUNNING after
# a newer push to the same branch had already started — 12 jobs each, ~105
# job-hours spent on head commits nobody would ever look at. That is not a
# billing footnote: it is the runner contention that turns a 15-minute shard
# into a 43-minute one and puts `tests/test_stack_resolver_perf.py` over
# pytest's timeout, which then reads as a red PR and costs a manual rerun.
# Agent-driven review rounds make it worse — three pushes to one PR in an hour
# is normal here.
#
# `cancel-in-progress` is deliberately scoped to `pull_request`. A push to
# `main` or `integration` is the merge-gate result for THAT commit and must
# never be cancelled by the next merge landing behind it.
#
# This does NOT reproduce the stuck-red-check problem `release.yml` had (see
# scripts/ci/docs_only_change.py): that came from two runs racing for the SAME
# commit, so the cancelled one's contexts stayed attached to the head SHA.
# Here the cancelled run belongs to the SUPERSEDED head, and GitHub evaluates
# required checks against the new head only.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-shard:
    # A shard normally finishes in ~15 min; a degraded runner (2026-09-07: every
    # test 4.5x slower, 78% done after 59 min) or a genuine hang would otherwise
    # hold the required `test` check for GitHub's 6 h default. Fail fast, re-run.
    timeout-minutes: 45
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv pip install --system ".[dev,server,extraction]"

      - name: Run tests (shard ${{ matrix.group }}/8)
        # pytest-split shards the suite across 8 parallel jobs, balanced by
        # the committed `.test_durations` file; `-n logical` (one worker per
        # logical CPU — xdist's `auto` counts PHYSICAL cores when psutil is
        # installed, which gave every shard a SINGLE worker on these runners
        # until 2026-09-07, `created: 1/1 worker` in every log) parallelises
        # within each shard across the runner's cores. tests/db_pg/ is
        # excluded here and runs in the dedicated test-pg job below so that
        # the pgserver session fixture doesn't inflate shard 1's wall-clock.
        # Regenerate durations with `pytest tests/ connectors/
        # --ignore=tests/db_pg --store-durations -n auto -q --tb=no` when shards
        # drift (target: ~3 min/shard).
        #
        # `connectors/` is included because the connector packages keep their tests
        # beside the code (`connectors/jira/tests/`, ...) rather than under `tests/`,
        # so none of them gated CI — 138 tests that ran only on developer machines,
        # including the entire failure-semantics surface of the jira connector.
        # Their measured `.test_durations` entries are committed alongside, so
        # they shard like any other test.
        run: |
          echo "runner: $(nproc) logical CPUs, $(free -g | awk '/^Mem/{print $2}') GB RAM"
          pytest tests/ connectors/ --ignore=tests/db_pg -v --tb=short -n logical --splits 8 --group ${{ matrix.group }}
        env:
          TESTING: "1"

  test-pg:
    # Runs tests/db_pg/ split across 8 parallel jobs. Keeping these separate
    # from the main split shards avoids the pgserver session-fixture startup
    # overhead (~60 s per worker) from landing in shard 1 and skewing the main
    # shards. pytest-split balances the groups by `.test_durations`; tests
    # without timing data receive the mean duration.
    #
    # The width follows one rule: this job must not be the critical path of a
    # CI run. It has been widened twice on that evidence (2 -> 4: two test-pg
    # jobs at 26-34 min against main shards at 11-17; 4 -> 8 in #2295: four
    # jobs at 22-27 min against main shards at 16-20, i.e. 5-7 min of every
    # run spent waiting on this job alone). Widening is nearly free — a job's
    # step timings show all but ~0.1 min is the pytest run itself
    # (checkout/setup-python/uv are cached) — and the committed durations hold
    # 57 min of db_pg test time against 102 min for the rest, so 8 ways puts
    # both jobs at roughly 7-13 min of tests with the main shards as the
    # (shorter) long pole. If test-pg is the slowest job again, widen it again.
    # A shard normally finishes in ~15 min; a degraded runner (2026-09-07: every
    # test 4.5x slower, 78% done after 59 min) or a genuine hang would otherwise
    # hold the required `test` check for GitHub's 6 h default. Fail fast, re-run.
    timeout-minutes: 45
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv pip install --system ".[dev,server,extraction]"

      - name: Run Postgres contract tests (shard ${{ matrix.group }}/8)
        run: |
          echo "runner: $(nproc) logical CPUs, $(free -g | awk '/^Mem/{print $2}') GB RAM"
          pytest tests/db_pg/ -v --tb=short -n logical --splits 8 --group ${{ matrix.group }}
        env:
          TESTING: "1"

  # Single required status check. Branch protection requires `test`, but the
  # matrices above publish `test-shard (1..8)` and `test-pg (1..8)` — this job
  # aggregates them into one `test` result so no branch-protection change is needed.
  test:
    needs: [test-shard, test-pg]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all test shards passed
        run: |
          if [ "${{ needs.test-shard.result }}" != "success" ]; then
            echo "::error::test-shard result was '${{ needs.test-shard.result }}' — one or more shards failed"
            exit 1
          fi
          if [ "${{ needs.test-pg.result }}" != "success" ]; then
            echo "::error::test-pg result was '${{ needs.test-pg.result }}' — Postgres contract tests failed"
            exit 1
          fi
          echo "All 8 test shards and all 8 Postgres contract shards passed."

  lint:
    # Advisory only (continue-on-error) — ruff + mypy surface issues but
    # never gate. Split out of release.yml's old test job; runs without the
    # full dependency install since neither tool needs it.
    #
    # The mypy step below is NOT a gate and cannot be made one without
    # clearing years of backlog first. Type checking that *does* block runs
    # over a curated typed core (scripts/typecheck-core.sh), driven from the
    # test suite by tests/test_exhaustiveness_gate.py so it rides the
    # already-required `test` check. Tighten that list, not this step.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check . || true
        continue-on-error: true

      - name: Type check with mypy
        run: |
          pip install mypy
          mypy src/ app/ cli/ connectors/ --ignore-missing-imports --no-error-summary || true
        continue-on-error: true

  cli-wheel-clean-install:
    # Catches the "wheel METADATA conflicts with transitive deps under fresh
    # resolver" class — exactly what the workspace-only `[tool.uv]
    # override-dependencies` does NOT protect against. Builds the wheel the
    # way `release.yml` ships it to analysts (`uv build --wheel`), then
    # installs it into a fresh `python:3.13-slim` container with `uv tool
    # install` (the path the `/setup` page advertises) and asserts the
    # `agnes` binary actually launches. Without this, a regression like
    # 0.53.3's `kbcstorage>=0.9.0 → urllib3<2.0.0` cap silently caps the
    # wheel METADATA, every existing test passes (workspace overrides the
    # cap), and the break only surfaces on the next analyst's first install.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build wheel
        run: uv build --wheel --out-dir dist

      - name: Write CLI install assertion script
        run: |
          cat > /tmp/smoke.py <<'PY'
          import sys, urllib3
          try:
              import kbcstorage  # noqa: F401
              sys.exit("REGRESSION: kbcstorage leaked into the CLI wheel — should be in [server] extra only")
          except ImportError:
              pass
          # Server-only deps re-tiered out of core (onboarding-speed slim-down):
          # a web framework and the chat runner's agent SDK have no business in
          # an analyst's CLI-only install. Same regression class as kbcstorage
          # above, different offenders.
          for mod, label in (("claude_agent_sdk", "claude-agent-sdk"), ("fastapi", "fastapi")):
              try:
                  __import__(mod)
                  sys.exit(f"REGRESSION: {label} leaked into the CLI wheel — should be in [server] extra only")
              except ImportError:
                  pass
          maj, minor = (int(x) for x in urllib3.__version__.split(".")[:2])
          assert (maj, minor) >= (2, 7), f"urllib3 too old: {urllib3.__version__}"
          print(f"OK: kbcstorage/claude-agent-sdk/fastapi absent, urllib3 {urllib3.__version__}")
          PY

      - name: Smoke install in fresh python:3.13-slim
        run: |
          docker run --rm \
            -v "$PWD/dist:/wheels:ro" \
            -v /tmp/smoke.py:/smoke.py:ro \
            python:3.13-slim bash -c '
              set -euo pipefail
              apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates >/dev/null
              curl -LsSf https://astral.sh/uv/install.sh | sh > /dev/null 2>&1
              export PATH="$HOME/.local/bin:$PATH"
              WHEEL=$(ls /wheels/agnes_the_ai_analyst-*-py3-none-any.whl | head -1)
              uv tool install --force "$WHEEL"
              agnes --version
              agnes --help > /dev/null
              agnes catalog --help > /dev/null
              # Run the assertion in the same venv uv tool created
              "$HOME/.local/share/uv/tools/agnes-the-ai-analyst/bin/python" /smoke.py
            '

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t data-analyst:test .

  rich-extras:
    # The extras-present half of tests/test_ingest_optional_extras.py. Every
    # other job installs `.[dev,server]`, where the docling tests skip
    # themselves — so without this job the claim "a docx ingests in the rich
    # image" would never be executed anywhere, and the `-rich` variant could
    # ship broken while CI stayed green.
    #
    # Not part of the default matrix: both extras pull torch, so this install
    # is minutes and gigabytes. Scheduled + manual, like docker-e2e, plus any
    # PR that touches the ingest path or the image's extras.
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'rich-extras')
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Free disk space
        # torch does not fit alongside the runner's preinstalled toolchains;
        # without this the install dies with a bare "no space left".
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Install dependencies with the heavy extras
        run: uv pip install --system ".[dev,server,docling,embeddings]"

      - name: Assert the extras are actually active
        # The gated tests SKIP when an extra is missing, so a failed install
        # would otherwise read as a pass.
        run: |
          python - <<'PY'
          from src.ingest.retrieval import retrieval_mode
          from src.ingest.text_extract import docling_capability
          assert docling_capability(), "docling not importable — the extras install did not take"
          assert retrieval_mode() == "hybrid", f"expected hybrid, got {retrieval_mode()}"
          print("extras active: docling=True retrieval=hybrid")
          PY

      - name: Run the ingest + retrieval suites
        run: |
          pytest tests/test_ingest_optional_extras.py tests/test_ingest_text_extract.py \
                 tests/test_ingest_runner.py tests/test_ingest_retrieval.py \
                 --tb=short -q

  docker-e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: docker-build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv pip install --system ".[dev,server]"

      - name: Start services
        run: |
          # docker-compose.yml declares `env_file: .env` as required; CI
          # ships no .env. Generate a random per-run JWT_SECRET_KEY so the
          # app's v0.56.0 fail-closed guard (refuses to start in production
          # without an explicit ≥32-char key; see app/auth/jwt.py and
          # PR #483) is satisfied. Random rather than hard-coded so the
          # value can't be mistaken for a real key in logs or screenshots.
          # All other runtime values are still provided by the compose
          # `environment:` block.
          echo "JWT_SECRET_KEY=$(openssl rand -hex 32)" > .env
          docker compose up -d --wait --wait-timeout 60

      - name: Pull the chat-sandbox stand-in image
        # tests/test_chat_docker_provider_daemon.py skips itself when this
        # image is absent — without the pull the daemon-backed sandbox tests
        # silently never ran anywhere in CI (they skipped here too), which is
        # how an attach-on-paused 409 regression once reached review unseen.
        run: docker pull python:3.13-slim

      - name: Run Docker E2E tests
        run: pytest tests/ -v --tb=short -m docker --timeout=120
        env:
          TESTING: "1"

      - name: Stop services
        if: always()
        run: docker compose down
