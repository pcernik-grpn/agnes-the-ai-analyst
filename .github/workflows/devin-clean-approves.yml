name: Devin clean verdict approves org members' PRs

# Why (#2295): `main`'s ruleset requires one approving review before a PR can
# enter the merge queue, and the queue evaluates that rule as ITSELF — a
# ruleset bypass actor's own PR is refused just the same ("At least 1
# approving review is required by reviewers with write access"). The rule
# exists to gate outside collaborators, who have write access here. Devin
# reviews every PR but only ever COMMENTS, and its app has no write access,
# so its verdict never counted. This workflow makes it count, for org members:
#
#   author is an org member AND Devin's latest verdict is clean -> approve
#   Devin's latest verdict lists issues                         -> dismiss ours
#
# Two ways in:
#   * pull_request_review (submitted/edited): Devin's review just landed —
#     Devin often submits an empty review and fills the verdict in by editing
#     it, and edits OLD reports to prepend "This report is out of date".
#   * workflow_dispatch with a PR number: catch-up. Devin re-reviews only some
#     pushes (its latest review matched the final head on 4 of the last 15
#     merged PRs) and a merge of `main` into a branch changes nothing in the
#     PR's diff, so it never re-reviews that. This mode evaluates Devin's
#     latest verdict-bearing review on the PR as it stands.
#
# An outside collaborator's PR (author_association COLLABORATOR) gets nothing
# here and still needs a human approval. So does the daily release-cut PR: it
# is authored by github-actions[bot], the identity this workflow approves
# with, and GitHub refuses self-approval — the person who merges the cut
# approves it, one click. The approval persists across later pushes, like a
# human's under this ruleset, and falls to a later Devin review that lists
# issues; leave the ruleset's "dismiss stale reviews on push" OFF.
#
# Every decision is made in the shell step, never in a job-level `if`, so a
# run that does nothing still logs WHY (the first version filtered in `if:`
# and Devin's own events were silently skipped, with nothing to read).
#
# Safety: the job never checks out PR code; payload values reach the shell via
# environment variables only. `pull_request_review` runs the workflow from the
# PR's merge ref, so a same-repo PR could edit this file — the exposure every
# `pull_request`-triggered workflow already has under this repository's
# default write token, not a new one. Approvals come from the Actions token
# (repo setting "Allow GitHub Actions to create and approve pull requests"
# must stay on).

on:
  pull_request_review:
    types: [submitted, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to evaluate from Devin's latest verdict (catch-up)"
        required: true
        type: string

permissions:
  pull-requests: write

concurrency:
  group: devin-clean-approves-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Decide from Devin's verdict (approve, dismiss, or explain why not)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          REVIEWER: ${{ github.event.review.user.login }}
          EVENT_BODY: ${{ github.event.review.body }}
        run: |
          set -euo pipefail
          echo "event=$EVENT action=${ACTION:-} pr=$PR reviewer=${REVIEWER:-}"

          if [ "$EVENT" = "pull_request_review" ] && [ "$REVIEWER" != "devin-ai-integration[bot]" ]; then
            echo "review by ${REVIEWER:-?}, not Devin; nothing to do"; exit 0
          fi

          # The PR as the API sees it — one code path for both modes.
          pr_json=$(gh api "repos/$REPO/pulls/$PR")
          author=$(jq -r '.user.login' <<<"$pr_json")
          assoc=$(jq -r '.author_association' <<<"$pr_json")
          head_repo=$(jq -r '.head.repo.full_name' <<<"$pr_json")
          head_sha=$(jq -r '.head.sha' <<<"$pr_json")
          echo "author=$author association=$assoc head_repo=$head_repo head=${head_sha:0:9}"

          if [ "$head_repo" != "$REPO" ]; then
            echo "PR from a fork; nothing to do"; exit 0
          fi
          # Deny-list, not allow-list: outside collaborators are always
          # COLLABORATOR, while an org member can read as MEMBER, OWNER or
          # (when membership is private to the token) CONTRIBUTOR.
          case "$assoc" in
            COLLABORATOR|NONE|FIRST_TIMER|FIRST_TIME_CONTRIBUTOR|MANNEQUIN)
              echo "author $author is not an organization member ($assoc); a human approval is required"; exit 0;;
          esac
          if [ "$author" = "github-actions[bot]" ]; then
            echo "bot-authored PR (release cut); this token cannot self-approve; a human approval is required"; exit 0
          fi

          # Devin's verdict. Event mode: the review that fired. Catch-up mode:
          # Devin's latest review that carries a verdict and is not out of date.
          if [ "$EVENT" = "pull_request_review" ]; then
            verdict="$EVENT_BODY"
            if printf '%s' "$verdict" | grep -q 'This report is out of date'; then
              echo "Devin edited an old report to mark it out of date; nothing to do"; exit 0
            fi
          else
            verdict=$(gh api --paginate --slurp "repos/$REPO/pulls/$PR/reviews?per_page=100" \
              --jq 'add | [.[] | select(.user.login == "devin-ai-integration[bot]") | .body
                      | select(test("This report is out of date") | not)
                      | select(test("Devin Review: No Issues Found|found [0-9]+ (new )?potential issue"))]
                    | last // ""')
            echo "latest verdict-bearing Devin review: $(printf '%s' "$verdict" | grep -oE 'Devin Review: No Issues Found|found [0-9]+ (new )?potential issues?' | head -1)"
          fi

          # Our current approval, if any (paginate: the endpoint pages at 30).
          ours_id=$(gh api --paginate --slurp "repos/$REPO/pulls/$PR/reviews?per_page=100" \
                     --jq 'add | [.[] | select(.user.login == "github-actions[bot]" and .state == "APPROVED")] | last | .id // empty')

          dismiss() {
            gh api -X PUT "repos/$REPO/pulls/$PR/reviews/$ours_id/dismissals" -f message="$1" >/dev/null
            echo "dismissed review $ours_id ($1)"
          }

          if printf '%s' "$verdict" | grep -Eq 'found [1-9][0-9]* (new )?potential issue'; then
            if [ -n "$ours_id" ]; then
              dismiss "Dismissed: Devin's latest review lists issues. It re-approves once a clean verdict lands."
            else
              echo "Devin lists issues; nothing of ours to dismiss"
            fi
          elif printf '%s' "$verdict" | grep -Eq 'Devin Review: No Issues Found|found 0 (new )?potential issues'; then
            if [ -n "$ours_id" ]; then echo "already approved (review $ours_id)"; exit 0; fi
            gh pr review "$PR" --repo "$REPO" --approve --body \
              "Approved on Devin's clean verdict (PR head ${head_sha:0:9}) for an organization member's pull request (see .github/workflows/devin-clean-approves.yml). Dismissed again if a later Devin review lists issues."
            echo "approved"
          else
            echo "no verdict to act on (empty review body, or Devin has not reviewed this PR); nothing to do"
          fi
