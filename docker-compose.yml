services:
  app:
    build: .
    # --proxy-headers + --forwarded-allow-ips make uvicorn honor the
    # X-Forwarded-Proto / X-Forwarded-Host headers any reverse proxy (Caddy,
    # nginx, Cloudflare Tunnel) sets. Without it, request.url_for() emits
    # http://localhost:8000/... even when the user is on https://, which
    # breaks OAuth callbacks (redirect_uri_mismatch). Belt-and-suspenders —
    # FORWARDED_ALLOW_IPS=* in .env does the same via env var.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'
    ports:
      - "8000:8000"
    volumes:
      - data:/data
      - ./config:/app/config:ro
      # - ./custom-connectors:/app/connectors/custom:ro  # Tier A: AI-generated connectors
    env_file: .env
    environment:
      - DATA_DIR=/data
      # Steer per-call tempdirs (Snowflake UNLOAD slice staging,
      # CSV→parquet intermediates) onto the data volume. The container
      # default ``/tmp`` lives on overlayfs (boot disk), which fills
      # under multi-GiB sliced exports — see connectors/keboola/
      # storage_api.py:get_temp_root. Operators can override per
      # deployment via .env (or unset to fall back to system /tmp).
      - AGNES_TEMP_DIR=${AGNES_TEMP_DIR:-/data/tmp}
      # /home/*/user/sessions/ doesn't exist in the Docker layout — skip
      # the legacy session-collector to silence per-10-min "0 users, 0 files"
      # + "Group 'data-ops' not found" log noise. The bare-VM deployment
      # path leaves this unset and continues to scan + log normally.
      - AGNES_SKIP_LEGACY_COLLECTOR=1
      # Pin the CA bundle for the statically linked libcurl inside DuckDB
      # extensions. Its own CA discovery is fragile under fd pressure and
      # intermittently fails new TLS handshakes with CURL error 77 while
      # warm connections keep working; an explicit path removes the
      # discovery step. Guarded by tests/test_compose_hardening.py.
      - CURL_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
    # The 1024-fd default is too small for a server juggling ~100 remote
    # tables, marketplace git clones, and parquet handles; fd exhaustion
    # during bursts makes libcurl's CA-file open fail with the same
    # CURL error 77 signature as a missing bundle.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Without this, the first three probes fire at 30/60/90s against a
      # container that is still booting, and Docker marks it unhealthy at
      # ~90s. `scheduler` AND `caddy` declare
      # `depends_on: app: condition: service_healthy`, so compose then
      # aborts with "dependency failed to start" and NEVER STARTS THEM —
      # and `restart: unless-stopped` does not rescue a container that was
      # created and never ran. Observed as: deploy reports success, app is
      # fine, and the scheduler is silently absent — no scheduled sync, no
      # consistency checks, no SLA polling — until someone notices a number
      # that stopped moving. `caddy` survived only because that recreate did
      # not touch it; a pass that recreates both takes the site down.
      #
      # Boot legitimately exceeds 90s after an image change. Operator stdio
      # MCP wheels live on the data volume and `pip install --user` lands in
      # the container filesystem, so every recreate reinstalls them (#806) —
      # ~2s per wheel, and the set grows as operators add sources — before
      # alembic even runs. Plain restarts skip that and boot fast; it is the
      # recreate, i.e. every deploy, that pays.
      #
      # During start_period failures do not count toward `retries`, and the
      # first success ends it immediately, so a generous value costs nothing
      # in steady state. The healthcheck should accommodate a boot the
      # deployment genuinely needs rather than the other way round.
      start_period: 180s
    restart: unless-stopped
    # Container memory cap. Default 4g suits a small / single-VM deploy.
    # DuckDB enforces memory_limit per-connection and (1.5+) defaults a
    # fresh connection to ~80% of the cgroup limit, so on a larger host
    # the right move is to raise BOTH this cap and the app's per-connection
    # budgets — leaving this at 4g on a 16 GiB VM starves the app while the
    # host sits idle, and the cgroup OOM-killer SIGKILLs uvicorn mid-WAL-write
    # (see stop_grace_period note below). Override per deployment via the
    # env_file, e.g. AGNES_APP_MEM_LIMIT=10g in .env.
    mem_limit: ${AGNES_APP_MEM_LIMIT:-4g}
    mem_reservation: 1g
    # CPU cap. Like mem_limit, override per deployment via the env_file
    # (e.g. AGNES_APP_CPUS=3.0 in .env on a 4-core host) instead of editing
    # this file — live edits are lost when the VM is recreated from infra.
    cpus: ${AGNES_APP_CPUS:-2.0}
    # Default 10s is too short for graceful uvicorn shutdown — under load,
    # in-flight requests + DuckDB CHECKPOINT (see lifespan in app/main.py)
    # need more headroom. SIGKILL mid-WAL-write produces a corrupt
    # system.duckdb.wal that the next image's DuckDB version cannot replay
    # ("Failure while replaying WAL ... GetDefaultDatabase with no default
    # database set"), 500-ing every authed request until WAL is removed.
    # Hits hardest during a Docker image upgrade window where the new
    # image's DuckDB version differs from the old container's, since
    # WAL replay across versions trips on internal assertions.
    stop_grace_period: 60s
    # Also joins agnes-apps-internal so chat sandboxes under
    # docker_egress_mode none/allowlist (their ONLY network) can still
    # reach the rails URL (AGNES_INTERNAL_URL=http://app:8000).
    # Joins agnes-apps so the app can reach data-app runtime containers
    # directly (e.g. readiness probes); apps-runner is the only process
    # that talks to the Docker socket, but the app shares the network.
    #
    # `default` is pinned as the app's gateway network so its default route —
    # hence all its egress, including the GCP metadata server for BigQuery
    # GCE-metadata auth — always leaves via `default`, never via `agnes-apps`.
    # Why the gateway pin matters: the container-metadata-hardening firewall
    # rule (infra/modules/customer-instance/startup-script.sh.tpl) DROPs
    # `agnes-apps -> 169.254.169.254`, source-scoped to the agnes-apps subnet
    # precisely so the app itself is spared; a multi-homed app whose default
    # route landed on agnes-apps would send its own metadata traffic into that
    # DROP and break BigQuery auth. Both pin fields are set because they answer
    # different questions on different engine generations:
    #   - `gw_priority` (Compose >= v2.33.1, effective on Docker Engine >= 28,
    #     where it is the ONLY field that selects the gateway network —
    #     `priority` deliberately does not; older engines ignore the value):
    #     the authoritative pin. Without it, Engine 28+ tie-breaks all-zero
    #     gateway priorities away from this intent.
    #   - `priority` (older field, controls connection ORDER): keeps `default`
    #     the first-connected network, which is what pre-28 engines derive the
    #     default route from.
    # Either way the pin is a config guarantee, not an incidental of Docker's
    # tie-break. NOTE: `gw_priority` sets the minimum Compose CLI at v2.33.1
    # (Feb 2025) — older Compose rejects the key at validation
    # (`docker compose config` to check yours).
    networks:
      default:
        priority: 100
        gw_priority: 100
      agnes-apps: {}
      agnes-apps-internal: {}

  # One-shot: run extractor then rebuild orchestrator views
  extract:
    build: .
    command: >
      sh -c "python -m connectors.keboola.extractor &&
             python -c 'from src.orchestrator import SyncOrchestrator; print(SyncOrchestrator().rebuild())'"
    volumes:
      - data:/data
      - ./config:/app/config:ro
    env_file: .env
    environment:
      - DATA_DIR=/data
      - AGNES_TEMP_DIR=${AGNES_TEMP_DIR:-/data/tmp}
    profiles:
      - extract

  scheduler:
    build: .
    command: python -m services.scheduler
    volumes:
      - data:/data
      - ./config:/app/config:ro
    env_file: .env
    environment:
      - DATA_DIR=/data
      - AGNES_TEMP_DIR=${AGNES_TEMP_DIR:-/data/tmp}
      - API_URL=http://app:8000
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-}
      # Mirror the app service: the scheduler calls /api/admin/run-session-collector
      # over HTTP rather than running the collector in-process, but if anything
      # ever invokes the collector module from this container directly, we want
      # the same skip behavior. Bare-VM path leaves this unset.
      - AGNES_SKIP_LEGACY_COLLECTOR=1
      # Same CA-bundle pin as the app service — the scheduler is the primary
      # runner of materialized BQ syncs (DuckDB bigquery extension) where
      # libcurl CA discovery fails under fd pressure with CURL error 77.
      - CURL_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
    # Same fd headroom as the app service — the scheduler fans out
    # concurrent HTTP jobs and inherits the same 1024-fd default.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    # Default 2g; override via AGNES_SCHEDULER_MEM_LIMIT in .env. See the
    # app service's mem_limit note for the cgroup / per-connection rationale.
    mem_limit: ${AGNES_SCHEDULER_MEM_LIMIT:-2g}
    cpus: ${AGNES_SCHEDULER_CPUS:-1.0}
    # Match app service — scheduler holds DuckDB connections too; same
    # WAL-corruption risk on SIGKILL during recreate.
    stop_grace_period: 60s

  # Extraction worker lane (spec §7.5 "Extraction inside Agnes (later)" /
  # §16 step 7 of docs/superpowers/specs/2026-08-27-fact-graph-over-
  # collections-design.md) — a SEPARATE process/container running ONLY the
  # `extraction` lane (AGNES_WORKER_LANES=extraction), so the
  # `corpus-extraction` job kind's producer subprocess (crawl -> convert ->
  # anonymize -> extract, potentially long-running) can never compete with
  # the `app` service's heavy/light lanes for CPU/memory, and a corpus
  # re-extraction never has a chance to block a table sync (the reason the
  # extraction lane exists at all — see app/worker/registry.py).
  #
  # Built from the `worker` Dockerfile target — see that stage's comment for
  # the EXTRACTION_PRODUCER_INSTALL build-arg extension point; this repo does
  # NOT vendor the producer (a separate project of the operator's, adopted per spec
  # §7.1). Off by default (`extraction.enabled: false`,
  # config/instance.yaml.example) AND behind its own compose profile — a
  # deployment that wants it running does BOTH: flips the config block and
  # starts this service with `--profile extraction-worker`.
  extraction-worker:
    build:
      context: .
      target: worker
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'
    profiles: ["extraction-worker"]
    volumes:
      - data:/data
      - ./config:/app/config:ro
    env_file: .env
    environment:
      - DATA_DIR=/data
      - AGNES_TEMP_DIR=${AGNES_TEMP_DIR:-/data/tmp}
      # Runs ONLY the extraction lane on this process — see
      # app/worker/runtime.py::selected_lanes(). The `app` service's own
      # heavy+light lanes are untouched; this is additive capacity, not a
      # replacement for it.
      - AGNES_ROLE=worker
      - AGNES_WORKER_LANES=extraction
      - AGNES_SKIP_LEGACY_COLLECTOR=1
      - CURL_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    # A producer subprocess (crawl/convert/anonymize/extract, possibly with
    # docling/embeddings-class deps if the operator's producer image needs
    # them) can be considerably heavier than the scheduler's own HTTP calls —
    # default sized like the app service, not the scheduler. Override via
    # .env on a deployment whose producer needs more.
    mem_limit: ${AGNES_EXTRACTION_WORKER_MEM_LIMIT:-4g}
    cpus: ${AGNES_EXTRACTION_WORKER_CPUS:-2.0}
    # Same WAL-corruption-on-SIGKILL rationale as the app/scheduler services.
    stop_grace_period: 60s

  # The only process holding the Docker socket. Deliberately dumb: no
  # registry access, no RBAC — the app decides *what* runs, this sidecar
  # only translates to `docker run`/stop/status calls, token-gated over
  # the internal compose network. See services/apps_runner/api.py.
  apps-runner:
    build: .
    command: python -m services.apps_runner
    profiles: ["apps"]
    volumes:
      - data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # A hard-required (`:?`) var here breaks EVERY `docker compose up`
      # invocation that doesn't set it, even for stacks that never select
      # the `apps` profile — compose validates interpolation for the whole
      # file before profile filtering (broke smoke-test/e2e-bind-mount,
      # rolled back #1007). Soft-default instead; `_check_token` in
      # services/apps_runner/api.py already fails closed (rejects every
      # request) when this is empty, so an operator who forgets to set it
      # while actually running --profile apps gets a safe 401, not a
      # silent auth bypass.
      - APPS_RUNNER_TOKEN=${APPS_RUNNER_TOKEN:-}
      # HTTP timeout for this sidecar's Docker daemon calls. Listed explicitly
      # because this service has NO `env_file: .env` — unlike `app`, it sees
      # only what is named here, so a value an operator puts in .env would
      # otherwise never reach the process and the knob would be dead. Empty
      # when unset, which the code reads as "use the default" (600s).
      - APPS_RUNNER_DOCKER_TIMEOUT=${APPS_RUNNER_DOCKER_TIMEOUT:-}
      - APPS_RUNNER_IMAGE_PREFIX=${APPS_RUNNER_IMAGE_PREFIX:-keboolapublic.azurecr.io/data-app-python-js}
      # Image-prefix allowlist for the chat-sandbox half of the API
      # (/sandboxes/*, used when chat.provider=docker). Separate from the
      # data-app prefix above: the two features run entirely different
      # images. The sandbox image is operator-built — see
      # app/initial_workspace_default/docker-sandbox/README.md — so the
      # default matches the default chat.docker_image tag. Same fail-closed
      # posture as the token: an empty prefix rejects every create.
      - CHAT_SANDBOX_IMAGE_PREFIX=${CHAT_SANDBOX_IMAGE_PREFIX:-agnes-chat-sandbox}
    # The bind-mounted docker socket is owned by root:docker, and its gid
    # varies per host. The agnes image runs as the non-root uid 999 (USER
    # agnes in the Dockerfile), so the sidecar can only talk to the daemon if
    # uid 999 is a member of the socket's group — otherwise every up()/stop()
    # fails the daemon handshake with `PermissionError(13)`, surfaced to the
    # caller as a 502 `runner_unavailable`. Add the host's docker gid as a
    # supplementary group. Running as root instead would work too, but the
    # sidecar writes each app's `config.json` under `/data/apps/<slug>/`, and
    # the app (uid 999) must be able to remove that dir on delete — so the
    # sidecar must stay uid 999 and gain socket access via the group, not by
    # becoming root. DOCKER_GID must be set to `stat -c '%g'
    # /var/run/docker.sock` on the host: the customer-instance startup script
    # sets it when data apps are enabled, and a hand-run `docker compose
    # --profile apps up` must export it too. Soft-default (not `:?`) so
    # non-apps compose invocations still parse (see the APPS_RUNNER_TOKEN
    # note above / #1007); the harmless fallback is the agnes gid itself,
    # which grants no socket access — the feature simply won't work until
    # DOCKER_GID is set, the same fail-safe posture as the empty token.
    group_add:
      - "${DOCKER_GID:-999}"
    networks: [default, agnes-apps]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25

  # Egress policy for chat.docker_egress_mode=allowlist: dual-homed on the
  # sandboxes' internal network (their ONLY network — no route out, so the
  # network is the enforcement layer) and the default bridge (its own way
  # out). Sandboxes point HTTP(S)_PROXY here; the proxy enforces the
  # hostname allowlist with a post-resolution IP re-check
  # (services/egress_proxy/authz.py — DNS-rebinding/metadata protection).
  egress-proxy:
    build: .
    command: python -m services.egress_proxy
    container_name: agnes-egress-proxy
    profiles: ["chat-docker-egress"]
    environment:
      # Comma-separated hostnames (exact or *.suffix). Keep in sync with
      # chat.docker_egress_allow_hosts in instance.yaml — the proxy is the
      # enforcing copy.
      - EGRESS_ALLOW_HOSTS=${EGRESS_ALLOW_HOSTS:-}
      - EGRESS_LISTEN=0.0.0.0:3128
      - EGRESS_BLOCK_PRIVATE=${EGRESS_BLOCK_PRIVATE:-1}
    networks: [default, agnes-apps-internal]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    # A dead proxy is fail-CLOSED, not fail-open: `agnes-apps-internal` is
    # `internal: true` and is the sandboxes' only network, so nothing gets
    # out. But nothing SURFACED it either — the process could exit and stay
    # down while every sandbox silently lost egress (#1250). This is a TCP
    # connect against the listener, not an HTTP GET: the proxy speaks raw
    # CONNECT/absolute-form and serves no health path, so a request probe
    # would report a healthy proxy as unhealthy. Port is read from
    # EGRESS_LISTEN so the probe cannot drift from the bind.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,socket;p=os.environ.get('EGRESS_LISTEN','0.0.0.0:3128').rpartition(':')[2];socket.create_connection(('127.0.0.1',int(p) if p.isdigit() else 3128),timeout=3).close()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Development stand-in for the kai-agent turn engine, which lives outside
  # this repository — so `chat.provider: kai-agent` had no way to be exercised
  # locally at all, and the frame path it drives (renderer included) could
  # only be tested by hand. Speaks the engine's SSE contract with scripted
  # turns; no model, no key, no database. See docs/kai-agent-local-dev.md.
  #
  # NOT named `kai-agent`: that name belongs to the real engine, which a
  # deployment runs as a compose service of its own (see the
  # customer-instance module's docker-compose.kai-agent.yml overlay), and
  # which the default `chat.kai_agent_url` (http://kai-agent:3000) therefore
  # resolves to with no configuration at all. A fixture must not squat the
  # production name: compose merges same-named services across the files in
  # COMPOSE_FILE and the overlay would inherit the `command` below, launching
  # the real engine image as this stub. Local dev points at the stub with
  # `AGNES_CHAT_KAI_AGENT_URL` instead — one env var in a flow that already
  # sets `KAI_HOST_JWT_SECRET`; see docs/kai-agent-local-dev.md.
  #
  # Gated behind its own profile too, so it can never appear in a stack that
  # did not ask for it by name. NEVER enable this profile in production: it
  # answers every turn with a canned script.
  kai-agent-stub:
    build: .
    command: python -m services.kai_engine_stub
    profiles: ["kai-stub"]
    environment:
      # Must match the Agnes process, or the stub rejects the host-minted
      # session JWT exactly as the real engine would. Soft-default (`:-`)
      # rather than required (`:?`): compose validates interpolation for the
      # whole file before filtering profiles, so a hard requirement here
      # would break every `docker compose up` that never selects this
      # profile (the lesson from the apps-runner token, rolled back in #1007).
      - KAI_HOST_JWT_SECRET=${KAI_HOST_JWT_SECRET:-}
      - KAI_HOST_JWT_ISSUER=${KAI_HOST_JWT_ISSUER:-agnes}
      - KAI_HOST_JWT_AUDIENCE=${KAI_HOST_JWT_AUDIENCE:-kai-agent}
      # Pause between SSE records — the interleaving is the thing under
      # observation, so it defaults to human-visible rather than instant.
      - KAI_STUB_STEP_DELAY=${KAI_STUB_STEP_DELAY:-0.35}
    restart: unless-stopped

  telegram-bot:
    build: .
    command: python -m services.telegram_bot
    volumes:
      - data:/data
    env_file: .env
    environment:
      - DATA_DIR=/data
    depends_on:
      - app
    profiles:
      - full
    restart: unless-stopped

  # NOTE: corporate-memory + session-collector previously ran here as
  # tight `restart: unless-stopped` boot loops behind `profiles: [full]`.
  # As of #176 the scheduler container drives both through admin HTTP
  # endpoints (/api/admin/run-corporate-memory,
  # /api/admin/run-session-collector). The verification-detector job
  # was never in compose; it now ships the same way. The app remains
  # the sole writer to system.duckdb. Operators previously running
  # COMPOSE_PROFILES=full need to drop those service stanzas from any
  # custom Compose overrides.

  # TLS reverse proxy. Corporate-CA certs mounted from /data/state/certs
  # (managed by scripts/ops/agnes-tls-rotate.sh on the VM). For local
  # development without certs, run without --profile tls and hit :8000
  # directly.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./static:/caddy-static:ro
      - /data/state/certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
      # Read-only mount of the agnes data dir so Caddy's file_server can
      # serve parquets directly (sendfile/zero-copy) and bypass the app's
      # uvicorn workers — see Caddyfile's @download handler. Mounted at
      # /srv (not /data) because /data is already the caddy_data volume.
      # Note: ./static is separately mounted at /caddy-static (above) so
      # Caddy's file_server can serve it directly via the static_file matcher.
      - data:/srv:ro
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      # Passes through whatever the operator set in .env. Caddyfile uses
      # {$CADDY_TLS:tls /certs/fullchain.pem /certs/privkey.pem} so:
      # - unset            → cert-file mode (corp PKI rotated by tls-rotate.sh)
      # - "tls <email>"    → Let's Encrypt auto-issue
      # - "tls internal"   → Caddy-managed self-signed
      - CADDY_TLS
      # Legacy hostname to redirect onto ${DOMAIN} during a domain migration
      # (see the Caddyfile's second site block). The default is spelled here,
      # with `:-`, rather than left to Caddy's `{$DOMAIN_ALIAS:127.0.0.1:8081}`:
      # Caddy's fallback applies only when the variable is UNSET, so an
      # empty-but-set value substituted an empty site address and failed config
      # parsing — taking the primary site down with it. Retiring the alias by
      # editing `.env` to `DOMAIN_ALIAS=` is the obvious operator action, and it
      # was the one that broke. Compose's `:-` treats empty and unset alike, so
      # both spellings now land on the inert loopback address.
      - DOMAIN_ALIAS=${DOMAIN_ALIAS:-127.0.0.1:8081}
      # Base for hosted data-app origins, `<slug>.<base>` (Caddyfile.apps-subdomain,
      # appended at boot when it is set). Same `:-` treatment as DOMAIN_ALIAS above
      # and for the same reason: an empty-but-set value would render the site
      # address `*.` and take Caddy — including the PRIMARY site — down at config
      # parse. `apps.invalid` is inert: `.invalid` is reserved by RFC 2606 and
      # never resolves, so the vhost exists but nothing can reach it.
      - APPS_SUBDOMAIN_BASE=${APPS_SUBDOMAIN_BASE:-apps.invalid}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - tls

volumes:
  data:
  caddy_data:
  caddy_config:

networks:
  default: {}
  agnes-apps:
    name: agnes-apps
  # Internal (no route out) network chat sandboxes join under
  # docker_egress_mode none/allowlist. Named to match what the sandbox
  # sidecar derives (chat.docker_network + "-internal"), so the
  # egress-proxy service above and the sandboxes land on the same bridge.
  agnes-apps-internal:
    name: agnes-apps-internal
    internal: true
